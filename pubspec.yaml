name: moolah
description: A new Flutter project.
publish_to: 'none' # Private package

version: 0.0.1+0

environment:
  sdk: '>=3.0.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI and general packages
  cupertino_icons: ^1.0.2
  get: ^4.6.5
  flutter_svg: ^2.0.7
  mobile_scanner: ^7.1.3
  http: ^1.1.0
  shared_preferences: ^2.2.1
  fluttertoast: ^9.0.0
  intl_phone_field: ^3.2.0
  device_info_plus: ^12.3.0
  mixpanel_flutter: ^2.4.4
  firebase_core: ^4.2.1
  onesignal_flutter: ^5.3.4
  google_sign_in: ^6.1.6
  ironsource_mediation: ^3.2.0
  fast_rsa: ^3.8.6
  google_maps_flutter: ^2.5.0
  flutter_rating_bar: ^4.0.1
  video_player: ^2.7.1
  webview_flutter: ^4.4.2
  firebase_crashlytics: ^5.0.5
  pointycastle: ^3.7.3
  encrypt: ^5.0.3
  rsa_encrypt: ^2.0.0
  rsa_pkcs: ^2.1.0
  basic_utils: ^5.7.0
  image_size_getter: ^2.1.2
  chewie: ^1.7.4
  crypto: ^3.0.3
  crypton: ^2.2.1
  pinput: ^6.0.1
  flutter_stripe: ^12.1.1
  flutter_js: ^0.8.5
  characters: ^1.4.0
  flat_buffers: ^23.5.26
  test_api: ^0.7.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.1.0
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true

  assets:
    - assets/images/common/
    - assets/images/home/
    - assets/images/profile/
    - assets/tutorial_video/

  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/dm-sans/DMSans-Regular.ttf
        - asset: assets/fonts/dm-sans/DMSans-Italic.ttf
          style: italic
        - asset: assets/fonts/dm-sans/DMSans-Bold.ttf
        - asset: assets/fonts/dm-sans/DMSans-Medium.ttf
    - family: praise
      fonts:
        - asset: assets/fonts/praise/Praise-Regular.ttf