plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.gms.google-services"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.moolahmobile.moolahmobileguardian"
    compileSdkVersion 36 // you were already using 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.moolahmobile.moolahmobileguardian"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36

        // Uses values generated by Flutter automatically
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            signingConfig signingConfigs.debug   // keep your current setting
            ndk {
                abiFilters 'armeabi-v7a','arm64-v8a','x86_64'
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def versionCode = variant.versionCode
            def buildType = variant.buildType.name
            output.outputFileName = "app-${buildType}-v${versionCode}.apk"
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

    // Firebase BOM + Analytics
    implementation platform("com.google.firebase:firebase-bom:32.6.0")
    implementation "com.google.firebase:firebase-analytics"

    // Google Play Services
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    implementation 'com.google.android.gms:play-services-basement:18.0.0'
    implementation 'com.google.android.gms:play-services-appset:16.0.2'

    // If you need the .aar dependency, uncomment:
    // implementation files("libs/api-3.22.aar")
}
